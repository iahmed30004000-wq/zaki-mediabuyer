# The image is built HERE (GitHub's machine), never on the server that serves the site — the OMS lesson: a
# `next build` beside production starved the live site. This job tests, builds the Dockerfile, proves the image
# starts and answers /api/health against a real Postgres, then publishes ghcr.io/<repository owner>/zaki-mediabuyer.
# Coolify only pulls. When COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN exist as repository secrets, it is told to deploy.
name: Image

on:
  push:
    branches: [main, feat/structure-and-themes]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: node scripts/scan-secrets.mjs

      - name: Build the image
        run: docker build -t mb:test .

      - name: Prove it starts and answers /api/health
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=mediabuyer -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mediabuyer postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U mediabuyer && break; sleep 1; done
          docker run -d --name app --network t -p 3140:3140 \
            -e DATABASE_URL=postgresql://mediabuyer:ci@db:5432/mediabuyer \
            -e AUTH_SECRET=ci-only-placeholder-secret-0000000000000 \
            -e ENCRYPTION_KEY=ci-only-placeholder-encryption-key-000000 \
            -e MOCK_MODE=1 mb:test
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3140/api/health || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 2
          done
          docker logs app; exit 1

      - name: Publish
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ref="${GITHUB_REF_NAME//\//-}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zaki-mediabuyer"
          for tag in "$ref" "sha-${GITHUB_SHA::7}" $([ "$ref" = "feat-structure-and-themes" ] && echo main); do
            docker tag mb:test "$image:$tag"
            docker push "$image:$tag"
          done

      - name: Tell Coolify to deploy (only when its secrets are set)
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_WEBHOOK_URL:-}" ] || [ -z "${COOLIFY_TOKEN:-}" ]; then echo "Coolify webhook not set yet — skipping"; exit 0; fi
          curl -fsS -X GET "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_TOKEN"
