# The image is built HERE (GitHub's machine), never on the server that serves the site — the OMS lesson: a
# `next build` beside production starved the live site. This job tests, builds the Dockerfile, proves the image
# starts and answers /api/health against a real Postgres, then publishes ghcr.io/<repository owner>/zaki-mediabuyer.
# Coolify only pulls. When COOLIFY_WEBHOOK_URL and COOLIFY_TOKEN exist as repository secrets, it is told to deploy.
name: Image

# A pull request into main: test + build + prove only (this is the check auto-merge waits for).
# A push to main (the merge): the same, then publish :main and tell Coolify to deploy.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # the auto-merge of a passing pull request (GitHub's own auto-merge needs a paid plan on a private repo)
  pull-requests: write
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: node scripts/scan-secrets.mjs

      - name: Build the image
        run: docker build --build-arg APP_VERSION=${GITHUB_SHA::7} -t mb:test .

      - name: Prove it starts and answers /api/health
        run: |
          docker network create t
          docker run -d --name db --network t -e POSTGRES_USER=mediabuyer -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=mediabuyer postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U mediabuyer && break; sleep 1; done
          docker run -d --name app --network t -p 3140:3140 \
            -e DATABASE_URL=postgresql://mediabuyer:ci@db:5432/mediabuyer \
            -e AUTH_SECRET=ci-only-placeholder-secret-0000000000000 \
            -e ENCRYPTION_KEY=ci-only-placeholder-encryption-key-000000 \
            -e MOCK_MODE=1 mb:test
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3140/api/health || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            sleep 2
          done
          docker logs app; exit 1

      # AUTO-MERGE (our own): a pull request into main whose checks above all passed is merged here. A merge made with
      # GITHUB_TOKEN does not start a new run, so this same run then publishes the image it just proved (built from the
      # merge result) and deploys it — exactly what a push to main does.
      - name: Merge the pull request (its checks passed)
        id: merge
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --merge --subject "Merge #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Publish
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || steps.merge.outputs.merged == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/zaki-mediabuyer"
          for tag in main "sha-${GITHUB_SHA::7}"; do
            docker tag mb:test "$image:$tag"
            docker push "$image:$tag"
          done

      - name: Tell Coolify to deploy (only when its secrets are set)
        if: (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') || steps.merge.outputs.merged == 'true'
        # «Pull latest and restart» of the Coolify service `mediabuyer`: pulls the image just published, then restarts
        # app + worker + db. The address is not a secret (a repo variable can override it); the token is:
        # COOLIFY_TOKEN = a Coolify API token (deploy ability) the owner creates himself, stored as a repo secret.
        env:
          COOLIFY_WEBHOOK_URL: ${{ vars.COOLIFY_WEBHOOK_URL || 'https://coolify.zakiai.io/api/v1/services/wqsoxkdltpwmcqudnqgybom9/restart?latest=true' }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "${COOLIFY_TOKEN:-}" ]; then echo "COOLIFY_TOKEN not set yet — deploy by hand in Coolify («Pull latest and restart»)"; exit 0; fi
          # the call is retried on a dropped connection (the Coolify host can be busy pulling); restarting twice is harmless
          curl -fsS --retry 4 --retry-all-errors --retry-delay 10 --max-time 120 -X POST "$COOLIFY_WEBHOOK_URL" -H "Authorization: Bearer $COOLIFY_TOKEN" -H "Accept: application/json"             || echo "the deploy call did not get an answer — checking whether the new version came up anyway"
          echo
          app_url="${{ vars.APP_HEALTH_URL || 'https://mediabuyer.zakiai.io/api/health' }}"
          want="${GITHUB_SHA::7}"
          sleep 30
          for i in $(seq 1 60); do
            body=$(curl -s --max-time 15 "$app_url" || true)
            case "$body" in *"\"version\":\"$want\""*) echo "live and healthy on $want"; exit 0 ;; esac
            sleep 6
          done
          echo "the site is not running $want after the deploy (last answer: ${body:0:200})"; exit 1
