# PRODUCTION on Coolify (resource type «Docker Compose», this file). Coolify pulls the image built by GitHub
# Actions — it never builds here. The site gets the domain (service `app`, port 3140); the worker runs the
# schedule; Postgres has its own volume. Every value marked ${…} is set in Coolify's environment screen.
services:
  app:
    image: ghcr.io/mkory18/zaki-mediabuyer:main
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://mediabuyer:${POSTGRES_PASSWORD}@db:5432/mediabuyer
      APP_URL: ${APP_URL}
      TZ: Asia/Amman
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      MOCK_MODE: ${MOCK_MODE:-1}
      META_API_VERSION: ${META_API_VERSION:-v24.0}
      META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
      OMS_BASE_URL: ${OMS_BASE_URL:-}
      OMS_TOKEN: ${OMS_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      INTERNAL_MODEL_BASE_URL: ${INTERNAL_MODEL_BASE_URL:-}
      INTERNAL_MODEL_NAME: ${INTERNAL_MODEL_NAME:-}
      PRIVACY_MODE: ${PRIVACY_MODE:-internal_only}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3140"

  worker:
    image: ghcr.io/mkory18/zaki-mediabuyer:main
    restart: unless-stopped
    command: ["npx", "tsx", "worker/index.ts"]
    environment:
      DATABASE_URL: postgresql://mediabuyer:${POSTGRES_PASSWORD}@db:5432/mediabuyer
      TZ: Asia/Amman
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      MOCK_MODE: ${MOCK_MODE:-1}
      META_API_VERSION: ${META_API_VERSION:-v24.0}
      META_SYSTEM_USER_TOKEN: ${META_SYSTEM_USER_TOKEN:-}
      OMS_BASE_URL: ${OMS_BASE_URL:-}
      OMS_TOKEN: ${OMS_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_CHAT_ID: ${TELEGRAM_OWNER_CHAT_ID:-}
      INTERNAL_MODEL_BASE_URL: ${INTERNAL_MODEL_BASE_URL:-}
      INTERNAL_MODEL_NAME: ${INTERNAL_MODEL_NAME:-}
      PRIVACY_MODE: ${PRIVACY_MODE:-internal_only}
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediabuyer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mediabuyer
      TZ: Asia/Amman
    volumes:
      - mediabuyer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediabuyer"]
      interval: 5s
      retries: 10

volumes:
  mediabuyer_db:
