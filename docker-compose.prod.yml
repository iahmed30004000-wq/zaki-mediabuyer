# PRODUCTION on Coolify (resource type «Docker Compose», pasted from this file). Coolify pulls the image built by
# GitHub Actions — it never builds here. The secrets are GENERATED BY COOLIFY (its SERVICE_PASSWORD_* magic
# variables), so no key ever passes through a chat or a file. The site is service `app` on port 3140, domain
# https://mediabuyer.zakiai.io set in Coolify; the worker runs the schedule; Postgres has its own volume.
# The links (Meta, OMS, Telegram, model) are added later in Coolify's Environment Variables screen.
services:
  app:
    image: ghcr.io/iahmed30004000-wq/zaki-mediabuyer:main
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3140
      - APP_URL=${SERVICE_URL_APP}
      - DATABASE_URL=postgresql://mediabuyer:${SERVICE_PASSWORD_POSTGRES}@db:5432/mediabuyer
      - ENCRYPTION_KEY=${SERVICE_PASSWORD_64_ENCRYPTION}
      - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTH}
      - TZ=Asia/Amman
      - MOCK_MODE=${MOCK_MODE:-1}
      - META_API_VERSION=${META_API_VERSION:-v24.0}
      - META_SYSTEM_USER_TOKEN=${META_SYSTEM_USER_TOKEN:-}
      - OMS_BASE_URL=${OMS_BASE_URL:-}
      - OMS_TOKEN=${OMS_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_CHAT_ID=${TELEGRAM_OWNER_CHAT_ID:-}
      - INTERNAL_MODEL_BASE_URL=${INTERNAL_MODEL_BASE_URL:-}
      - INTERNAL_MODEL_NAME=${INTERNAL_MODEL_NAME:-}
      - PRIVACY_MODE=${PRIVACY_MODE:-internal_only}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3140/api/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    image: ghcr.io/iahmed30004000-wq/zaki-mediabuyer:main
    restart: unless-stopped
    command: ["npx", "tsx", "worker/index.ts"]
    environment:
      - DATABASE_URL=postgresql://mediabuyer:${SERVICE_PASSWORD_POSTGRES}@db:5432/mediabuyer
      - ENCRYPTION_KEY=${SERVICE_PASSWORD_64_ENCRYPTION}
      - AUTH_SECRET=${SERVICE_PASSWORD_64_AUTH}
      - TZ=Asia/Amman
      - MOCK_MODE=${MOCK_MODE:-1}
      - META_API_VERSION=${META_API_VERSION:-v24.0}
      - META_SYSTEM_USER_TOKEN=${META_SYSTEM_USER_TOKEN:-}
      - OMS_BASE_URL=${OMS_BASE_URL:-}
      - OMS_TOKEN=${OMS_TOKEN:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OWNER_CHAT_ID=${TELEGRAM_OWNER_CHAT_ID:-}
      - INTERNAL_MODEL_BASE_URL=${INTERNAL_MODEL_BASE_URL:-}
      - INTERNAL_MODEL_NAME=${INTERNAL_MODEL_NAME:-}
      - PRIVACY_MODE=${PRIVACY_MODE:-internal_only}
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mediabuyer
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=mediabuyer
      - TZ=Asia/Amman
    volumes:
      - mediabuyer_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediabuyer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mediabuyer_db:
